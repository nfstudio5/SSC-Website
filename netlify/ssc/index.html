<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shira Sue Carmi — Directions</title>
<meta name="theme-color" content="#731A45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  :root { --plum: #731A45; --gold: #C8901A; --cream: #F2E7D5; --pad: clamp(20px, 3vw, 48px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--pad);
    background: radial-gradient(120% 90% at 30% 20%, var(--plum) 40%, #5E1238 100%) fixed;
    color: var(--cream);
    font: 14px/1.5 "Courier Prime", "Courier New", monospace;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .label { margin: 0; color: var(--gold); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: .4em 0 0; font: 400 clamp(26px, 2.4vw, 36px)/1 "Bodoni Moda", Didot, serif; }

  ol { list-style: none; margin: 3em 0; padding: 0; }
  li + li { margin-top: clamp(14px, 2.5vh, 28px); }
  li a { display: grid; grid-template-columns: 4em auto 1fr; align-items: baseline; }
  .no { color: var(--gold); font-size: 12px; }
  .t {
    font: 400 min(11vw, 12vh)/.95 "Bodoni Moda", Didot, serif;
    font-variation-settings: "opsz" 96;
    letter-spacing: -.025em;
    transition: color .3s;
  }
  .s { grid-column: 2 / span 2; margin-top: max(10px, min(2.4vw, 2.6vh)); color: var(--gold); opacity: .85; font-size: 12px; }
  li a:hover .t, li a:focus-visible .t { color: var(--gold); font-style: italic; }
  a:focus-visible { outline: 1px dotted var(--gold); outline-offset: 6px; }
  @media (max-width: 600px) { li a { grid-template-columns: 3em auto 1fr; } .t { font-size: 12.5vw; } }
</style>
</head>
<body>

<header>
  <p class="label">Website directions — draft</p>
  <h1>Shira Sue Carmi</h1>
</header>

<!--
  The directions. Each one is a self-contained page in its own folder:
    /ssc/v1/index.html, /ssc/v2/index.html, ...
  To change a version: replace that folder's index.html with the new file.
  To add one: make a new folder (v5) with its index.html and copy a <li> below.
  To remove one: delete its folder and its <li>.
-->
<ol>
  <li><a href="/ssc/v1/"><span class="no">N°1</span><span class="t">Gentlewoman</span><span class="s">Futura, monumental SSC</span></a></li>
  <li><a href="/ssc/v2/"><span class="no">N°2</span><span class="t">Vogue</span><span class="s">Bodoni, printed SSC</span></a></li>
  <li><a href="/ssc/v3/"><span class="no">N°3</span><span class="t">Contents</span><span class="s">Bodoni, no initials</span></a></li>
  <li><a href="/ssc/v4/"><span class="no">N°4</span><span class="t">Quotes</span><span class="s">Initials on the cover, her words inside</span></a></li>
</ol>

<p class="label">Brooklyn, New York</p>

</body>
</html>
